<table cdk-table [dataSource]="dataSource" class="table">
  @if (selectable()) {
  <ng-container cdkColumnDef="checkbox">
    <th cdk-header-cell *cdkHeaderCellDef></th>
    <td cdk-cell *cdkCellDef="let element" class="table__data-cell">
      <input type="checkbox" checked />&nbsp;
    </td>
  </ng-container>
  } @for (tableCell of cellTemplates(); track tableCell.columnName) {
  <ng-container cdkColumnDef="position">
    <th
      cdk-header-cell
      *cdkHeaderCellDef
      class="table__header-cell subtitle-semi-bold"
    >
      <ng-container [ngTemplateOutlet]="tableCell.headerTemplate() ?? null">
      </ng-container>
    </th>
    <td cdk-cell *cdkCellDef="let element" class="table__data-cell">
      <ng-container [ngTemplateOutlet]="tableCell.dataTemplate() ?? null">
      </ng-container>
    </td>
  </ng-container>
  }
