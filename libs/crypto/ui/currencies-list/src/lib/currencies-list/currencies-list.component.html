<div class="currencies-list">
  <div class="currencies-list__search">
    <input
      class="currencies-list__input caption2-normal"
      [placeholder]="'Search'"
    />
    <portfolio-icon
      class="currencies-list__search-icon"
      [name]="'lookup'"
      [iconSize]="'original'"
    ></portfolio-icon>
  </div>

  <div class="currencies-list__tabs">
    <!-- TODO tabs should be a component -->
    <crypto-ui-tabs [tabsList]="tabsList()"></crypto-ui-tabs>
  </div>

  <crypto-ui-table [data]="coinsList()">
    <ng-template cryptoHeaderCell="'pair'" [align]="'left'">Pair</ng-template>
    <ng-template
      cryptoDataCell="'pair'"
      [selectFrom]="coinsList()"
      [align]="'left'"
      let-item
      let-index="index"
    >
      <div class="currencies-list__pair-cell">
        <portfolio-icon
          [name]="index < 3 ? 'star' : 'empty-star'"
          [iconSize]="'original'"
          [align]="'text-top'"
        ></portfolio-icon>
        <portfolio-icon [name]="item.pair.icon"></portfolio-icon>
        <p class="caption2-bold">{{ item.pair.label }}</p>
      </div>
    </ng-template>

    <ng-template cryptoHeaderCell="'currentPrice'">Current Price</ng-template>
    <ng-template
      cryptoDataCell="'currentPrice'"
      [selectFrom]="coinsList()"
      let-item
    >
      <div>
        <p
          cryptoTrendColor
          [value]="item.dayToDayPrice.amount - item.currentPrice"
        >
          {{ item.currentPrice }}
        </p>
      </div>
    </ng-template>

    <ng-template cryptoHeaderCell="'dayToDayPrice'">Day to day</ng-template>
    <ng-template
      cryptoDataCell="'dayToDayPrice'"
      [selectFrom]="coinsList()"
      let-item
    >
      <div>
        <p cryptoTrendColor [value]="item.dayToDayPrice.change">
          {{ item.dayToDayPrice.change | cryptoTrendSign }}%
        </p>
        <p cryptoTrendColor [value]="item.dayToDayPrice.amount">
          {{ item.dayToDayPrice.amount | cryptoTrendSign }}
        </p>
      </div>
    </ng-template>

    <ng-template cryptoHeaderCell="'transactionAmount'"
      >Transaction amount</ng-template
    >
    <ng-template
      cryptoDataCell="'transactionAmount'"
      [selectFrom]="coinsList()"
      let-item
    >
      <div class="currencies-list__transactionAmount-cell">
        <p>
          {{ item.transactionAmount }}
        </p>
        <p>million</p>
      </div>
    </ng-template>
  </crypto-ui-table>
</div>
