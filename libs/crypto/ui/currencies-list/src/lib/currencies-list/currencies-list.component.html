<div class="currencies-list">
  <div class="currencies-list__search">
    <input
      class="currencies-list__input caption2-normal"
      [placeholder]="'Search'"
    />
    <portfolio-icon
      class="currencies-list__search-icon"
      [name]="'lookup'"
      [iconSize]="'original'"
    ></portfolio-icon>
  </div>

  <div class="currencies-list__tabs">
    <crypto-ui-tabs [tabsList]="tabsList()"></crypto-ui-tabs>
  </div>

  <crypto-ui-table [data]="coinsList()">
    <ng-template cryptoHeaderCell="'pair'" [align]="'left'" sortable
      ><p class="currencies-list__header-cell">Pair</p></ng-template
    >
    <ng-template
      cryptoDataCell="'pair'"
      [selectFrom]="coinsList()"
      [align]="'left'"
      let-item
      let-index="index"
    >
      <div class="currencies-list__pair-cell currencies-list__data-cell">
        <portfolio-icon
          [name]="index < 3 ? 'star' : 'empty-star'"
          [iconSize]="'original'"
          [align]="'text-top'"
        ></portfolio-icon>
        <portfolio-icon [name]="item.pair.icon"></portfolio-icon>
        <p class="caption2-bold">{{ item.pair.label }}</p>
      </div>
    </ng-template>

    <ng-template cryptoHeaderCell="'currentPrice'" sortable
      ><p class="currencies-list__header-cell">Current Price</p></ng-template
    >
    <ng-template
      cryptoDataCell="'currentPrice'"
      [selectFrom]="coinsList()"
      let-item
    >
      <div class="currencies-list__data-cell">
        <p
          cryptoTrendColor
          [value]="item.dayToDayPrice.amount - item.currentPrice"
        >
          {{ item.currentPrice }}
        </p>
      </div>
    </ng-template>

    <ng-template cryptoHeaderCell="'dayToDayPrice'" sortable
      ><p class="currencies-list__header-cell">Day to day</p></ng-template
    >
    <ng-template
      cryptoDataCell="'dayToDayPrice'"
      [selectFrom]="coinsList()"
      let-item
    >
      <div class="currencies-list__data-cell">
        <p cryptoTrendColor [value]="item.dayToDayPrice.change">
          {{ item.dayToDayPrice.change | cryptoTrendSign }}%
        </p>
        <p cryptoTrendColor [value]="item.dayToDayPrice.amount">
          {{ item.dayToDayPrice.amount | cryptoTrendSign }}
        </p>
      </div>
    </ng-template>

    <ng-template cryptoHeaderCell="'transactionAmount'" sortable
      ><p class="currencies-list__header-cell">
        Transaction amount
      </p></ng-template
    >
    <ng-template
      cryptoDataCell="'transactionAmount'"
      [selectFrom]="coinsList()"
      let-item
    >
      <div
        class="currencies-list__data-cell currencies-list__transactionAmount-cell"
      >
        <p>
          {{ item.transactionAmount }}
        </p>
        <p>million</p>
      </div>
    </ng-template>
  </crypto-ui-table>
</div>
