<button
  class="button button--{{ bgColor() }} button--{{ type() }} button--radius-{{
    borderRadius()
  }} caption-bold"
  [class.button--full-width]="fullWidth() || null"
  [class.button--skew-right]="skew() === 'right' || null"
  [class.button--skew-left]="skew() === 'left' || null"
  [class.button--inactive]="!active()"
  (click)="clicked.emit()"
  type="button"
>
  <ng-content select="portfolio-icon"></ng-content>
  <ng-content></ng-content>
</button>
